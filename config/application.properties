# Secure Group Communication System - Configuration
# Database Configuration
# MySQL JDBC Connection Settings (2012-compliant)
db.driver=com.mysql.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/secure_group_communication
db.username=sgc_user
db.password=sgc_password
db.pool.size=10

# Application Configuration
# Messaging Server Ports
msg.server.port=3000
admin.server.port=1000
leave.request.port=1001

# Security Configuration
# Encryption algorithm (AES-128 for 2012 standards)
encryption.algorithm=AES
encryption.key.size=128
encryption.mode=CBC
encryption.padding=PKCS5Padding

# Logging Configuration
log.level=INFO
log.file=logs/sgc.log
log.max.file.size=10485760

# UI Configuration
ui.look.and.feel=javax.swing.plaf.metal.MetalLookAndFeel
ui.font.family=Garamond
ui.font.size=15

# File Paths (cross-platform compatible)
resources.images.path=resources/images
resources.documents.path=resources/documents
temp.file.path=temp
